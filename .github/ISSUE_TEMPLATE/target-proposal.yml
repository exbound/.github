name: Target proposal
description: Propose a new software target for reconstruction
labels: ["target-proposal"]
body:
  - type: input
    id: product
    attributes:
      label: Product and versions
      description: The software, vendor, and the versions that matter.
    validations:
      required: true
  - type: textarea
    id: lockin
    attributes:
      label: Why users are locked in
      description: Hardware binding, proprietary data, required workflow, cost, or monopoly — what makes this worth reconstructing.
    validations:
      required: true
  - type: textarea
    id: oracle
    attributes:
      label: Verification oracle
      description: What lets us check correctness — a reference install, sample files, an automation API, a physical instrument.
    validations:
      required: true
  - type: textarea
    id: obtainable
    attributes:
      label: What's obtainable without a license
      description: Free viewers, trial editions, sample files, documentation, open readers already in existence.
    validations:
      required: false
  - type: textarea
    id: prior
    attributes:
      label: Prior art
      description: Existing open-source tools, format documentation, or reverse-engineering work.
    validations:
      required: false
